<script>
const META=__META__,CD=__CD__,byc={};META.forEach(d=>byc[d.c]=d);
(function(){var ths=Array.from(new Set(META.map(function(d){return d.th||'(미분류)';}))).sort();var el=document.getElementById('fth');ths.forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;el.appendChild(o);});})();
function topDB(){document.getElementById('fdb').value='넥근접';vbk='';document.getElementById('grp').value='';document.getElementById('sort').value='v2';R();}
function v(id){return document.getElementById(id).value}
var vbk='';var WATCH=(function(){try{return new Set(JSON.parse(localStorage.getItem('jq_watch')||'[]'))}catch(e){return new Set()}})();
function saveW(){try{localStorage.setItem('jq_watch',JSON.stringify([].concat(Array.from(WATCH))))}catch(e){}}
function toggleW(c){if(WATCH.has(c))WATCH.delete(c);else WATCH.add(c);saveW();R();}
var VB=[['','전체'],['t1','1조+'],['t2','3천억~1조'],['t3','1천~3천억'],['t4','300~1천억'],['t5','100~300억'],['t6','100억미만'],['fav','⭐관심']];
function inBucket(x,k){if(x==null)return false;if(k==='t1')return x>=10000;if(k==='t2')return x>=3000&&x<10000;if(k==='t3')return x>=1000&&x<3000;if(k==='t4')return x>=300&&x<1000;if(k==='t5')return x>=100&&x<300;if(k==='t6')return x<100;return true;}
function renderTabs(){document.getElementById('vtabs').innerHTML=VB.map(function(t){return '<span class="tab'+(vbk===t[0]?' on':'')+'" onclick="setVB(\''+t[0]+'\')">'+t[1]+(t[0]==='fav'?' ('+WATCH.size+')':'')+'</span>';}).join('');}
function setVB(k){vbk=k;R();}
function pass(d){var q=v('q').toLowerCase(),mk=v('fmk'),db=v('fdb'),sc=v('fsc'),hk=v('fhk'),il=v('fil'),th=v('fth');
 if(mk&&d.mk!==mk)return 0;if(sc&&d.sc!==sc)return 0;if(hk&&d.hk!==hk)return 0;if(il&&d.ilp!==il)return 0;if(th&&(d.th||'(미분류)')!==th)return 0;
 if(db==='넥라인돌파'&&d.ws!=='넥라인돌파')return 0;if(db==='반등초입'&&d.ws!=='반등초입')return 0;if(db==='Y'&&d.wf!=='Y')return 0;if(db==='근접'&&d.wf!=='근접')return 0;
 if(db==='넥근접'&&!((d.ws==='반등초입'||d.ws==='넥라인돌파')&&d.wn!=null&&d.wn>=-5))return 0;
 if(vbk==='fav'){if(!WATCH.has(d.c))return 0;}else if(vbk&&!inBucket(d.v2,vbk))return 0;
 if(q&&(d.n+d.c).toLowerCase().indexOf(q)<0)return 0;return 1;}
function stb(ws){if(!ws)return '';var cl=ws==='넥라인돌파'?'b-break':ws==='반등초입'?'b-early':'b-near';return '<span class="badge '+cl+'">'+ws+'</span>';}
function spark(code){var x=CD[code];if(!x||!x.wc||x.wc.length<3)return '';var c=x.wc,n=c.length,lo=Math.min.apply(0,c),hi=Math.max.apply(0,c),r=(hi-lo)||1,W=300,H=42;
function X(i){return i/(n-1)*W;}function Y(v){return (1-(v-lo)/r)*(H-6)+3;}
var pts=c.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ');var up=c[n-1]>=c[0];var db=x.dbw;
var s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px;display:block;background:#fafbfc;border-radius:6px">';
if(db){var ny=Y(db.nk);s+='<line x1="0" y1="'+ny.toFixed(1)+'" x2="'+W+'" y2="'+ny.toFixed(1)+'" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>';}
s+='<polyline points="'+pts+'" fill="none" stroke="'+(up?'#c0392b':'#1f6fc0')+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/>';
if(db){[['1',db.i1],['2',db.i2]].forEach(function(t){var i=t[1];if(i>=0&&i<n)s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(c[i]).toFixed(1)+'" r="3" fill="#c0392b"/>';});}
return s+'</svg>';}
function cardHtml(d){return '<div class="card'+(d.wf==='Y'||d.wf==='근접'?' up':'')+(WATCH.has(d.c)?' fav':'')+'" data-c="'+d.c+'"><div class="ch" onclick="tog(this)">'
 +'<div class="nm"><span class="star" onclick="event.stopPropagation();toggleW(\''+d.c+'\')">'+(WATCH.has(d.c)?'★':'☆')+'</span> '+d.n+' <span class="c">('+d.c+')</span>'+stb(d.ws||'')+(d.wf==='Y'&&!d.ws?'<span class="badge b-early">Y</span>':'')+'<span class="tap">차트 ▼</span></div>'
 +'<div class="mt"><b class="'+(d.chg>=0?'pos':'neg')+'">'+(d.chg>0?'+':'')+d.chg+'%</b> · 2주거래대금 <b>'+(d.v2||0).toLocaleString()+'억</b> · 추세 '+(d.tr!=null?d.tr+'x':'-')+' · '+(d.hk||'')+'</div>'
 +'<div class="mt2">시총 '+(d.si!=null?d.si.toLocaleString()+'억':'-')+' · 테마 '+(d.th||'-')+' · 일봉 '+(d.ilp||'-')+' · 주봉 '+(d.jup||'-')+(d.wn!=null?' · 넥대비 '+(d.wn>0?'+':'')+d.wn+'%':'')+'</div>'
 +'<div style="margin-top:5px">'+spark(d.c)+'<div style="font-size:9px;color:#bbb;text-align:right;margin-top:1px">주봉 미니 · 탭→일봉·주봉 상세</div></div>'+'</div><div class="chart" hidden></div></div>';}
function R(){renderTabs();var s=v('sort'),rows=META.filter(pass);rows.sort(function(a,b){return (b[s]||-1e18)-(a[s]||-1e18);});
 document.getElementById('cnt').textContent=rows.length+'종목 (탭하면 차트)';
 var grp=v('grp'),h='';
 if(grp){var gv=function(d){return grp==='th'?(d.th||'(미분류)'):d[grp];};var seen=[];rows.forEach(function(d){if(seen.indexOf(gv(d))<0)seen.push(gv(d));});
  seen.forEach(function(g){var rs=rows.filter(function(d){return gv(d)===g;});var sv=rs.reduce(function(a,d){return a+(d.v2||0);},0);
   h+='<div style="background:#1F3A5F;color:#fff;padding:7px 12px;margin:8px 10px 0;border-radius:8px;font-weight:700;font-size:13px">'+g+' · '+rs.length+'종목 · 거래대금 '+sv.toLocaleString()+'억</div>';
   rs.forEach(function(d){h+=cardHtml(d);});});}
 else rows.forEach(function(d){h+=cardHtml(d);});
 document.getElementById('list').innerHTML=h;}
function tog(ch){var card=ch.parentNode,ct=card.querySelector('.chart'),code=card.dataset.c;
 if(!ct.hidden){ct.hidden=true;ch.querySelector('.tap').textContent='차트 ▼';return;}
 ch.querySelector('.tap').textContent='차트 ▲';ct.hidden=false;
 if(!ct.dataset.d){ct.innerHTML='<canvas></canvas><canvas></canvas><div class="hint">일봉(위)·주봉(아래)·MA·거래량·1·2번바닥·넥라인(점선)</div>';var cs=ct.querySelectorAll('canvas');var x=CD[code];
  setTimeout(()=>{draw(cs[0],x.do,x.dh,x.dl,x.dc,x.dv,x.dt,x.dbd);draw(cs[1],x.wo,x.wh,x.wl,x.wc,x.wv,x.wt,x.dbw);},20);ct.dataset.d=1;}}
function ma(a,k){var o=Array(a.length).fill(null),s=0;for(var i=0;i<a.length;i++){s+=a[i];if(i>=k)s-=a[i-k];if(i>=k-1)o[i]=s/k;}return o;}
function draw(cv,o,h,l,c,vv,tk,db){var dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;var g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 var n=c.length,pL=44,pR=6,pT=6,pB=13,vH=36,pH=H-pT-pB-vH-5,lo=Math.min.apply(0,l),hi=Math.max.apply(0,h),pr=(hi-lo)||1;lo-=pr*.05;hi+=pr*.05;
 var X=i=>pL+(W-pL-pR)*(i+0.5)/n,Y=p=>pT+pH*(1-(p-lo)/(hi-lo)),bw=Math.max(1,(W-pL-pR)/n*.6);
 g.font='8px sans-serif';g.textAlign='right';for(var k=0;k<=3;k++){var p=lo+(hi-lo)*k/3,y=Y(p);g.strokeStyle='#eee';g.beginPath();g.moveTo(pL,y);g.lineTo(W-pR,y);g.stroke();g.fillStyle='#999';g.fillText(Math.round(p).toLocaleString(),pL-2,y+3);}
 for(var i=0;i<n;i++){var up=c[i]>=o[i];g.strokeStyle=up?'#c0392b':'#1f6fc0';g.fillStyle=up?'#c0392b':'#1f6fc0';var x=X(i);g.beginPath();g.moveTo(x,Y(h[i]));g.lineTo(x,Y(l[i]));g.stroke();var yo=Y(o[i]),yc=Y(c[i]);g.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)));}
 [[5,'#444'],[20,'#e08e0b'],[60,'#2e7d32'],[120,'#8e24aa']].forEach(function(m){if(n<m[0])return;var mm=ma(c,m[0]);g.strokeStyle=m[1];g.lineWidth=1;g.beginPath();var st=0;for(var i=0;i<n;i++){if(mm[i]==null)continue;var x=X(i),y=Y(mm[i]);if(!st){g.moveTo(x,y);st=1;}else g.lineTo(x,y);}g.stroke();});
 if(db){g.strokeStyle='#555';g.setLineDash([4,3]);var y=Y(db.nk);g.beginPath();g.moveTo(pL,y);g.lineTo(W-pR,y);g.stroke();g.setLineDash([]);g.fillStyle='#c0392b';g.textAlign='center';[['1',db.i1],['2',db.i2]].forEach(function(t){var i=t[1];if(i<0||i>=n)return;var x=X(i),yy=Y(l[i]);g.beginPath();g.arc(x,yy+6,3,0,7);g.fill();g.fillText(t[0],x,yy+17);});}
 var vt=pT+pH+5,vm=Math.max.apply(0,vv)||1;for(var i=0;i<n;i++){var up=c[i]>=o[i];g.fillStyle=up?'rgba(192,57,43,.5)':'rgba(31,111,192,.5)';var bh=vH*vv[i]/vm;g.fillRect(X(i)-bw/2,vt+vH-bh,bw,bh);}
 g.fillStyle='#999';g.textAlign='center';(tk||[]).forEach(function(t){g.fillText(t[1],X(t[0]),H-2);});}
renderTabs();R();
</script></body></html>

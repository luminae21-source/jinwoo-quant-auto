<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>진우퀀트 용어사전</title>
<style>
 :root{--bg:#0f1620;--card:#18222f;--ink:#e8eef5;--sub:#9fb0c3;--line:#2b3a4d;--accent:#4fa8ff;--pill:#243345;--term:#ffd54f}
 @media(prefers-color-scheme:light){:root{--bg:#f4f7fb;--card:#fff;--ink:#16212e;--sub:#5b6b7d;--line:#d7e0ea;--accent:#1f73d6;--pill:#e7eef6;--term:#b5790a}}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5}
 .wrap{max-width:560px;margin:0 auto;padding:14px 12px 60px}
 h1{font-size:18px;margin:6px 2px 2px}
 .note{font-size:12px;color:var(--sub);margin:0 2px 10px}
 .search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
 #q{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px}
 .cat{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--sub);text-transform:uppercase;margin:18px 4px 6px}
 .item{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px;margin:8px 0}
 .t{font-weight:800;color:var(--term);font-size:15px}
 .d{font-size:14px;margin-top:4px}
 .u{font-size:13px;color:var(--sub);margin-top:4px}
 .none{color:var(--sub);text-align:center;padding:30px;display:none}
 .foot{font-size:11px;color:var(--sub);text-align:center;margin-top:20px}
 mark{background:rgba(79,168,255,.3);color:inherit;border-radius:3px}
</style></head><body><div class="wrap">
<h1>진우퀀트 용어사전</h1>
<p class="note">모르는 약어를 검색창에 치면 바로 떠요. 쉬운 풀이 + "우리 프로젝트에선 무슨 뜻".</p>
<div class="search"><input id="q" type="search" placeholder="🔍 약어·단어 검색 (예: VWAP, ATR, 선반영)" autocomplete="off"></div>
<div id="list"></div>
<div class="none" id="none">검색 결과가 없어요. 다른 단어로 찾아보세요.</div>
<p class="foot">정보·학습용. 투자 추천 아님. 값은 시점에 따라 갱신될 수 있어요.</p>
</div>
<script>
const DATA=[
["기초·시장",[
 ["VWAP","거래량가중평균가 — 그날 거래가 가장 많이 이뤄진 평균 가격.","'VWAP 이하 지정가로 사라' = 그날 평균보다 조금 싸게 사서 비싸게 안 사기."],
 ["KOSPI / KOSDAQ","한국 두 증시. KOSPI=대형 위주, KOSDAQ=중소·성장·테마 위주.","본체는 KOSPI 18종, 테마 lane은 KOSDAQ."],
 ["KOSPI200 / KOSDAQ150","각 시장 대표 우량종목 묶음 지수(파생상품 기준).","만기·지수 비교의 기준."],
 ["EW (등가중)","Equal Weight — 모든 종목을 같은 비중으로 담는 것.","코스닥 '정직한 벤치마크'. 우리 팩터가 이걸 못 이겨서 기각됐음."],
 ["MKT (시장)","시가총액가중 시장수익 — 큰 회사가 더 큰 비중.","벤치마크. 단 EW를 못 이기면 MKT만 이긴 건 '착시'로 봄."],
 ["ETF","여러 종목을 묶어 거래하는 상품(예: KODEX인버스).","인버스 헤지 시도에 썼다가 기각."],
 ["리밸런스","정해진 주기마다 포트폴리오를 다시 맞추는 것.","본체는 월 1회. 실측상 월간이 최적."],
 ["VI","변동성완화장치 — 급등락 시 잠깐 거래를 멈추는 한국 제도.","테마 진입 시 VI·상한가 호가면 신규 진입 금지."],
 ["네 마녀의 날","선물·옵션이 한꺼번에 만기되는 날(분기 3·6·9·12월 둘째 목요일).","변동성 주의 '인지'용. 실측상 며칠 전 급락 군집은 약함."],
 ["금통위 / FOMC","한국·미국 기준금리 결정 회의.","캘린더 고정일. 성장주 변동성 이벤트."]
]],
["본체 점수(팩터)",[
 ["v3.7.2","본체 시스템 이름(버전). KOSPI 18종 점수엔진.","현재 운용 중인 '시스템 트랙'."],
 ["팩터","주가/재무에서 뽑은 '점수 재료'(모멘텀·베타·재무체력 등).","6개+보조를 더해 '체력_최종' 총점."],
 ["F_korean / 체력","Piotroski(피오트로스키) 한국형 재무체력 점수(0~9).","흑자·현금흐름·부채↓ 등 9개 체크. 높을수록 재무 튼튼."],
 ["Mom12","최근 12개월 수익률(추세).","많이 오른 추세면 가점(+2)."],
 ["Echo","먼 과거 모멘텀 — 1년 전~7개월 전 수익률.","최근 6개월은 일부러 빼고 본 모멘텀."],
 ["BAB / 베타(β)","BAB=저베타 우대. 베타=시장 대비 얼마나 출렁이나.","덜 출렁이는 방어주에 가점(β<0.4면 +2)."],
 ["Sloan / 발생액(accrual)","현금이 안 들어온 장부상 이익 비중 — 이익의 '질'.","발생액 크면 이익 질 의심(감점)."],
 ["NOA","순영업자산 — 회사가 자산을 과하게 키웠나(과투자).","과투자면 감점."],
 ["FAR","과대낙폭 역발상 신호.","한 달새 −5%↓인데 재무 튼튼하면 +2(싸게 사기)."],
 ["등급 S+/S/A…","총점 구간. S+≥14·S≥12·A≥9·B≥6·C≥3·D≥0·F<0.","매수는 S+·S·A만."],
 ["cap (상한)","한 종목·한 업종이 차지할 수 있는 최대 비중.","종목 15%·섹터 35%로 쏠림 방지."]
]],
["리스크·방어",[
 ["MA200 / 10개월선","200일(≈10개월) 이동평균 추세선.","종가가 이 선 위=보유, 아래=관망(행동규칙)."],
 ["SMA","단순이동평균 — 일정 기간 평균값 선.","MA200을 월간 10개월 SMA로 계산."],
 ["MDD","최대낙폭 — 고점 대비 가장 많이 빠진 폭.","본체 −12%대. 방어의 핵심 관리지표."],
 ["변동성 타겟팅","변동성 커지면 노출을 줄이는 방어.","검증서 수익만 깎여 기각."],
 ["CPPI / 드로다운 컨트롤","손실 한도선(플로어) 밑으로 안 가게 비중 조절.","갭·반등 놓침 위험 → 비채택."],
 ["휩쏘(whipsaw)","속았다 되돌아가는 잦은 헛신호(샀다 팔았다 반복).","추세필터의 비용. 줄이려는 시도도 기각."],
 ["regime(국면)","상승장/하락장 같은 '시장 국면'을 판정해 대응.","8번 방어 시도 중 다수 — 전부 기각."],
 ["VKOSPI","코스피200 변동성지수(공포지수). 급등=시장 공포.","스트레스 프록시. 만기 검증에 사용."],
 ["σ(시그마)/실현변동성","수익률이 흔들린 정도(표준편차).","본체 월σ 15%, 워치 26.7% 등."],
 ["테일헤지/풋옵션","급락 보험(풋 매수).","평소 비용(bleed)이 커서 비채택."]
]],
["테마 lane",[
 ["테마 lane","KOSDAQ 성장·테마를 진우 판단으로 고르는 '재량 차선'.","기계적 선정이 다 실패해서 forward 테마만 남음."],
 ["forward / backward","forward=미래·테마·촉매 / backward=과거 재무·팩터.","시스템=backward, 진우=forward."],
 ["Track W","반사실(가정) 측정 — 직관 픽 vs 같은 돈 시스템 픽 비교.","6개월 누적 ≥0이면 직관이 밥값=유지."],
 ["반사실(counterfactual)","'그때 다른 선택을 했다면?'을 같은 조건으로 비교.","Track W의 핵심 측정 방식."],
 ["thesis","매수 근거 한 줄(왜 지금 사나).","사기 전에 적어야 사후 합리화 차단."],
 ["무효화 트리거","'이러면 판다'를 미리 정한 조건.","thesis 붕괴·−20% 등. 닿으면 기계적 청산."],
 ["선반영 / late / 과열","이미 다 올라 카탈리스트가 남지 않은 상태.","+100% 급등·52주 고점 근접이면 진입 보류."],
 ["가드레일","부도·동전주·관리종목 등 위험을 거르는 안전 필터.","생존을 위한 1차 방어."],
 ["카탈리스트(촉매)","주가를 움직일 사건(수주·실적·정책 등).","테마 lane 진입의 핵심 근거."],
 ["리드-래그 / 美연료","미국 대장→한국 대장→코스닥 peer로 번지는 순서.","美 상승이 '연료'. peer가 아직 안 오르면 따라잡기 후보."],
 ["수급","외국인·기관의 순매수(누가 사고 있나).","DART촉매와 동시 점등하면 주목."],
 ["DART","금융감독원 전자공시 시스템(수주·증설 등 공시).","촉매 스캐너 입력."],
 ["2%룰","한 종목에서 자본의 2%만 잃게 수량을 정함.","손절폭이 멀면 적게 산다."],
 ["ATR","평균진폭 — 하루 평균 가격 변동폭.","손절선=진입가−2.5×ATR. 워치 일ATR≈7.3%."],
 ["ADTV","일평균거래대금 — 하루 거래되는 돈 규모.","주문은 ADTV의 1% 이내(유동성)."],
 ["킬스위치","손실 한도 도달 시 신규 진입 정지.","lane 일−7%/주−12%/월−20%."],
 ["H-D / H-W / H-C","보유기간: 며칠 / 몇 주 / 다음 카탈리스트까지.","테크윙·테스는 H-C."],
 ["정찰 진입/분할","한 번에 다 안 사고 1/3만 먼저 사보는 것.","추세 확인 후 잔여 매수."]
]],
["통계·검증",[
 ["CAGR","연환산 수익률 — 평균적으로 1년에 몇 % 불었나.","전략 성과 핵심 지표."],
 ["Sharpe","위험조정수익 — 출렁임 대비 수익이 얼마나 좋나.","높을수록 효율적."],
 ["IR (정보비율)","벤치마크 대비 초과수익의 안정성.","IR_EW=등가중 대비, IR_MKT=시장 대비."],
 ["IC (정보계수)","신호가 미래수익을 맞히는 상관도.","수급팩터 IC≈0이라 예측력 없음=기각."],
 ["alpha(알파)","벤치마크를 넘는 초과수익.","+3%p 넘어야 합격."],
 ["PIT","Point-In-Time — 그 시점에 알 수 있던 정보만 사용.","미래 훔쳐보기(look-ahead) 방지."],
 ["OOS","Out-Of-Sample — 만들 때 안 쓴 기간으로 재검증.","3분할 모두 같은 방향이어야 신뢰."],
 ["생존편향","살아남은 종목만 봐서 성과가 부풀려지는 함정.","상폐 종목 포함해 통제."],
 ["사전등록","검증 전에 합격선을 미리 못박는 것.","결과 보고 기준 바꾸기 금지."],
 ["net / gross","gross=비용 전, net=거래비용 차감 후.","판정은 항상 net."],
 ["SUE / PEAD","SUE=깜짝실적 표준화, PEAD=실적 후 주가가 천천히 반영되는 현상.","v3.9 모듈(×0.5 관찰 중)."]
]],
["데이터·버전",[
 ["FDR / pykrx / KRX","주가·수급 데이터를 받는 도구·거래소.","샌드박스는 막혀서 PC에서 받음."],
 ["모듈 C / D / 영역3","C=PEAD, D=regime, 영역3=종목 확장.","C만 관찰 중, D·영역3 종결."],
 ["v3.9 / v4.0 / v4.1 / v4.2","버전: PEAD / regime / KOSDAQ팩터 / 수급팩터.","v4.0·4.1·4.2 기각, v3.9 관찰."],
 ["breakout / 52주 신고가","52주 최고가를 뚫는 종목을 사는 모멘텀 전략.","KOSDAQ서 EW에 패배=기각."],
 ["B전환 / 시스템·위성트랙","실계좌를 시스템(룰) 트랙 + 위성(재량) 트랙으로 빌드.","위성=테마 lane, 전계좌 ≤10%."],
 ["self-test","코드가 제대로 도는지 스스로 검사.","엔진마다 N/N 통과 확인."]
]]
];
const list=document.getElementById('list'),none=document.getElementById('none'),q=document.getElementById('q');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(f){
 f=(f||'').trim().toLowerCase();list.innerHTML='';let hits=0;
 for(const [cat,items] of DATA){
  const m=items.filter(it=>!f||(it[0]+' '+it[1]+' '+it[2]).toLowerCase().includes(f));
  if(!m.length)continue;
  const h=document.createElement('div');h.className='cat';h.textContent=cat;list.appendChild(h);
  for(const it of m){hits++;
   const d=document.createElement('div');d.className='item';
   let t=esc(it[0]);if(f){const re=new RegExp('('+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');t=t.replace(re,'<mark>$1</mark>')}
   d.innerHTML='<div class="t">'+t+'</div><div class="d">'+esc(it[1])+'</div><div class="u">📌 '+esc(it[2])+'</div>';
   list.appendChild(d);}
 }
 none.style.display=hits?'none':'block';
}
q.addEventListener('input',e=>render(e.target.value));
render('');
</script></body></html>

<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진우퀀트 통합 대시보드 — 2026-06-30</title>
<style>
:root{
 --font-sans:-apple-system,'Segoe UI',Roboto,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
 --border-radius-md:8px;
 --color-background-secondary:#f4f5f7;--color-background-success:#e3f6ea;
 --color-background-warning:#fff4e0;--color-background-info:#e7f0fb;
 --color-border-tertiary:#e3e6eb;
 --color-text-secondary:#5a6270;--color-text-tertiary:#8b919b;
 --color-text-success:#177d43;--color-text-warning:#a8650f;--color-text-info:#1e5fb0;
}
html,body{margin:0;background:#ffffff;color:#1a1d23}
body{font-family:var(--font-sans);padding:14px 16px;line-height:1.5;max-width:780px;margin:0 auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table{border-collapse:collapse}
@media (prefers-color-scheme:dark){
 html,body{background:#0f1115;color:#e8eaed}
 :root{--color-background-secondary:#181b22;--color-border-tertiary:#262a33;
  --color-text-secondary:#9aa0aa;--color-text-tertiary:#7a818c;
  --color-background-success:#143b2a;--color-text-success:#7ee0ad;
  --color-background-warning:#3b2e14;--color-text-warning:#ffd479;
  --color-background-info:#16314f;--color-text-info:#9fc4e8;}
}
</style></head><body>
<h2 class="sr-only">진우퀀트 수퍼사이클 통합 대시보드 — 기준 2026-06-30. 테마 현황, 보유 4-way, 종목 풀, 매수후보.</h2>
<div style="padding:1rem 0; font-family:var(--font-sans)">

<div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px">
  <span style="font-size:18px; font-weight:500">진우퀀트 통합 대시보드</span>
  <span style="font-size:13px; color:var(--color-text-secondary)">2026-06-30</span>
</div>
<p style="font-size:12px; color:var(--color-text-tertiary); margin:0 0 1.25rem; line-height:1.6">의사결정 보조 · 검증된 매수룰 아님 · production v3.7.2 무변경</p>

<div style="font-size:13px; font-weight:500; color:var(--color-text-secondary); margin-bottom:8px"><i class="ti ti-flame" aria-hidden="true" style="font-size:15px; vertical-align:-2px"></i> 테마 현황</div>
<div id="themes" style="margin-bottom:1.5rem"></div>

<div style="font-size:13px; font-weight:500; color:var(--color-text-secondary); margin-bottom:8px"><i class="ti ti-wallet" aria-hidden="true" style="font-size:15px; vertical-align:-2px"></i> 내 보유 · production 18 (4-way)</div>
<div id="holds" style="margin-bottom:1.5rem"></div>

<div style="font-size:13px; font-weight:500; color:var(--color-text-secondary); margin-bottom:8px"><i class="ti ti-list-numbers" aria-hidden="true" style="font-size:15px; vertical-align:-2px"></i> 종목 풀 · 전 시장 점수 (287종)</div>
<div id="grades" style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:10px"></div>
<div id="pool" style="margin-bottom:1.5rem"></div>

<div style="font-size:13px; font-weight:500; color:var(--color-text-secondary); margin-bottom:4px"><i class="ti ti-target" aria-hidden="true" style="font-size:15px; vertical-align:-2px"></i> 집중모드 매수후보 · ON 테마 주도주</div>
<p style="font-size:11px; color:var(--color-text-warning); margin:0 0 8px"><i class="ti ti-alert-triangle" aria-hidden="true"></i> 백테스트 기각 — 기계적 추종 시 시장 −14.7%p·MDD −40%. 인지용</p>
<div id="buy"></div>

</div>
<script>
const D={"themes":[["전력/전기장비","ON·가속",146,76,"on"],["반도체","ON·가속",146,72,"on"],["반도체/전자","관찰",109,57,"near"],["로봇/자동화","ON·가속",91,73,"on"],["2차전지","관찰",43,62,"near"],["자동차","관찰",16,50,"near"]],
"holds":[["삼성전자","BAB드래그","반도체",-1,426],["SK하이닉스","BAB드래그","반도체",-2,631],["대덕전자","BAB드래그","반도체",-1,732],["한미반도체","BAB드래그","반도체",-2,93],["삼성SDI","정상","2차전지",-2,172],["삼성물산","정상","유통/소비",1,124],["ISC","정상","기계/장비",-1,177],["에코프로비엠","정상","2차전지",-2,20],["기아","정상","자동차",1,-3],["NH투자증권","정상","금융",0,-24],["두산에너빌리티","정상","원자력/원전",-2,-31],["KT&G","정상","유통/소비",2,-32],["KB금융","정상","금융",2,-36],["LIG넥스원","정상","우주항공/방산",-2,-42],["에코프로머티","정상","2차전지",-2,-50],["한화에어로","정상","우주항공/방산",0,-51],["NAVER","정상","인터넷/SW",2,-70],["알테오젠","정상","바이오/제약",2,-81],["삼양식품","정상","유통/소비",2,-95],["아모레퍼시픽","정상","화학/에너지",1,-97],["카카오","정상","인터넷/SW",1,-106]],
"grades":{"S+":36,"S":45,"A":106,"B":86,"C":13,"D":1},
"pool":[[1,"LG디스플레이","반도체/전자","S+",18.7,9],[2,"HL만도","자동차","S+",17.3,6],[3,"비에이치아이","원자력/원전","S+",17.0,-18],[4,"삼성바이오로직스","바이오/제약","S+",17.0,-83],[5,"삼성중공업","조선","S+",16.7,-12],[6,"NHN","인터넷/SW","S+",16.0,5],[7,"에이피알","화학/에너지","S+",15.7,83],[8,"더존비즈온","반도체/전자","S+",15.7,1],[9,"롯데쇼핑","유통/소비","S+",15.7,31],[10,"GS리테일","유통/소비","S+",15.7,-25]],
"buy":[["전력/전기장비",false,[["대한광통신",1921],["가온전선",406],["에스피지",271]]],["반도체",false,[["RF머트리얼즈",1137],["코리아써키트",800],["대덕전자",732]]],["로봇/자동화",false,[["로보티즈",393],["로보스타",367],["레인보우로보틱스",95]]],["2차전지",true,[["비나텍",263],["비츠로셀",191],["엘앤에프",127]]]]};

const C={on:["var(--color-background-success)","var(--color-text-success)"],warn:["var(--color-background-warning)","var(--color-text-warning)"],near:["var(--color-background-info)","var(--color-text-info)"],gray:["var(--color-background-secondary)","var(--color-text-secondary)"]};
const gc={"S+":"var(--color-text-success)","S":"var(--color-text-success)","A":"var(--color-text-info)","B":"var(--color-text-secondary)","C":"var(--color-text-secondary)","D":"var(--color-text-tertiary)"};
function badge(t,k){const c=C[k];return `<span style="background:${c[0]};color:${c[1]};font-size:11px;font-weight:500;padding:1px 7px;border-radius:var(--border-radius-md);white-space:nowrap">${t}</span>`}
function row(inner){return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px">${inner}</div>`}

document.getElementById('themes').innerHTML=D.themes.map(t=>{const k=t[4];return row(
 `<span style="display:flex;align-items:center;gap:8px;min-width:0"><span style="font-weight:500">${t[0]}</span>${badge(t[1],k)}</span>`+
 `<span style="color:var(--color-text-secondary);white-space:nowrap">12M +${t[2]}% · 폭 ${t[3]}%</span>`)}).join('');

document.getElementById('holds').innerHTML=D.holds.map(h=>{const drag=h[1]==='BAB드래그';return row(
 `<span style="display:flex;align-items:center;gap:8px;min-width:0">${badge(h[1],drag?'warn':'gray')}<span style="${drag?'font-weight:500':''}">${h[0]}</span><span style="color:var(--color-text-tertiary);font-size:11px">${h[2]}</span></span>`+
 `<span style="color:${h[4]>0?'var(--color-text-success)':'var(--color-text-secondary)'};white-space:nowrap">${h[4]>0?'+':''}${h[4]}%</span>`)}).join('');

document.getElementById('grades').innerHTML=Object.entries(D.grades).map(([g,n])=>
 `<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 10px;display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:13px;font-weight:500;color:${gc[g]}">${g}</span><span style="font-size:18px;font-weight:500">${n}</span></div>`).join('');

document.getElementById('pool').innerHTML=D.pool.map(p=>row(
 `<span style="display:flex;align-items:center;gap:8px;min-width:0"><span style="color:var(--color-text-tertiary);width:16px">${p[0]}</span><span style="font-weight:500">${p[1]}</span><span style="color:${gc[p[3]]};font-size:11px;font-weight:500">${p[3]}</span><span style="color:var(--color-text-tertiary);font-size:11px">${p[2]}</span></span>`+
 `<span style="color:var(--color-text-secondary);white-space:nowrap">${p[4]} · ${p[5]>0?'+':''}${p[5]}%</span>`)).join('');

document.getElementById('buy').innerHTML=D.buy.map(b=>{
 const names=b[2].map(c=>`<span style="white-space:nowrap"><span style="font-weight:500">${c[0]}</span> <span style="color:var(--color-text-success);font-size:12px">+${c[1]}%</span></span>`).join('<span style="color:var(--color-text-tertiary)"> · </span>');
 return `<div style="padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="font-size:12px;font-weight:500">${b[0]}</span>${b[1]?badge('감속주의','warn'):badge('ON','on')}</div><div style="font-size:13px;line-height:1.7">${names}</div></div>`}).join('');
</script>
</body></html>
